name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Windows is mandatory, not optional: path handling, CRLF, CONIN$, DPAPI and the
  # PowerShell prompter are all Windows-specific code paths (PLAN.md §11.4).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 20 dropped: the pinned pnpm needs node:sqlite (>= 22.13), so a 20
        # leg dies in setup-node before any script of ours runs.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # The protocol's core claim, mechanically checked. If this fails the build is
  # broken regardless of anything else (PLAN.md §11.1, §11.2).
  zero-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:zero-leak

  # packages/core must not depend on any host, harness or model-vendor SDK,
  # or the "plugs into any AI coding tool" claim is no longer true (PLAN.md §12.1).
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:portability

  # The examples/demo walk-through, executed against the built CLI so the
  # documented five-command flow cannot silently rot (init -> gate fails ->
  # set -> gate passes -> run -> status, sentinel never printed).
  example-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trailing ellipsis: build the CLI AND its workspace dependencies --
      # filtering to the package alone leaves @envseal/core un-built and tsc
      # cannot resolve it (the same ordering trap the plugin hit in a139eea).
      - run: pnpm --filter @envseal/cli... build
      - run: node scripts/probe-example-demo.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Warnings are debt: the count hit 41 before being paid down to zero.
      # --max-warnings keeps it at zero; a new warning fails the job.
      - run: pnpm lint --max-warnings 0
