name: Release

# The only supported way to publish envseal. Two reasons it must run here and not on a laptop:
#
#   1. `npm publish` does not rewrite pnpm's `workspace:` protocol. Seven of the nine packages
#      would ship `"@envseal/core": "workspace:*"` and every install would fail with
#      EUNSUPPORTEDPROTOCOL. `pnpm publish` rewrites it to the concrete version.
#   2. npm's provenance attestation is generated from a GitHub OIDC token, which only exists in
#      Actions with `id-token: write`. Every package sets `publishConfig.provenance: true`, so a
#      publish without that token fails loudly instead of shipping an unattested tarball.
#
# See docs/publishing.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run the preflight only, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    environment: npm-publish
    steps:
      - name: Require version tag for manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == false && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Manual publish (dry-run unchecked) must run on a refs/tags/v* ref, not ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Fail in SECONDS, not after five minutes of gates, when the secret is
      # missing, revoked, or not publish-capable (e.g. a classic Publish-type
      # token, which demands an interactive OTP that CI can never answer —
      # the credential must be an Automation-type classic token, or a granular
      # token with write on every @envseal/* package). NOTE: without the env
      # mapping below, NODE_AUTH_TOKEN resolves to setup-node's placeholder
      # (XXXXX-…) inside the generated .npmrc and every read 401s — that
      # placeholder in the step env dump is the tell, not a leaked secret.
      - name: Preflight npm credential
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] || [ "$NODE_AUTH_TOKEN" = "XXXXX-XXXXX-XXXXX-XXXXX" ]; then
            echo "::error::NPM_TOKEN did not reach the environment (empty or placeholder)"
            exit 1
          fi
          echo "token present, length ${#NODE_AUTH_TOKEN}"
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # the same gates CI runs; a release must not be the first time these are checked
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint --max-warnings 0

      - run: node scripts/probe-example-demo.mjs

      # packs every package and greps the packed manifests for a surviving `workspace:`
      - name: Release preflight
        run: pnpm release:dry --skip-build

      # Forensics for the ghost test artifact (packages/core/index.html): some
      # Linux CI gate generates it, which used to abort the publish leg with
      # "working tree is dirty". The file is gitignored now; this step records
      # its contents when present so the postmortem can name the generator.
      - name: Ghost-file forensics
        if: always()
        run: |
          if [ -f packages/core/index.html ]; then
            echo "=== ghost file present: packages/core/index.html ==="
            head -c 2000 packages/core/index.html
            echo
          else
            echo "no ghost file"
          fi

      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: pnpm release --skip-build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
