<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">envseal architecture</title>
  <desc id="d">An untrusted model declares what it needs through seven env_* tools over MCP JSON-RPC. The harness forwards tool calls and spawns the trusted local broker over stdio. Secret values travel only from the user through secure local input surfaces into the broker's sinks (.env, keychain, vault) — never through the model.</desc>

  <defs>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1F1A14" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowInk" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1F1F1F" fill-opacity="0.45"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="520" fill="#F0EEE6"/>

  <!-- eyebrow -->
  <text x="56" y="60" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="2.5" fill="#8A8880">ENVSEAL — HOW A SECRET MOVES (SEP/1 PROTOCOL)</text>

  <!-- ================= MODEL card ================= -->
  <g transform="translate(56,96)">
    <rect x="0" y="0" width="280" height="300" rx="16" fill="#FFFFFF" stroke="#1F1F1F" stroke-opacity="0.08" filter="url(#cardShadow)"/>
    <text x="22" y="38" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#8A8880">01 · UNTRUSTED FOR VALUES</text>
    <text x="22" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1F1F1F">Model</text>
    <line x1="22" y1="88" x2="258" y2="88" stroke="#1F1F1F" stroke-opacity="0.08"/>

    <!-- tool chips -->
    <g font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13.5" fill="#55524A">
      <rect x="22" y="104" width="102" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="32" y="120">env_describe</text>
      <rect x="136" y="104" width="96" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="146" y="120">env_declare</text>

      <rect x="22" y="137" width="96" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="32" y="153">env_request</text>
      <rect x="136" y="137" width="82" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="146" y="153">env_await</text>

      <rect x="22" y="170" width="88" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="32" y="186">env_verify</text>
      <rect x="136" y="170" width="68" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="146" y="186">env_use</text>

      <rect x="22" y="203" width="88" height="24" rx="7" fill="#FBFAF5" stroke="#1F1F1F" stroke-opacity="0.10"/>
      <text x="32" y="219">env_revoke</text>
    </g>

    <text x="22" y="268" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12.5" fill="#8A8880">names &amp; tickets — never values</text>
  </g>

  <!-- ================= HARNESS card ================= -->
  <g transform="translate(460,96)">
    <rect x="0" y="0" width="280" height="300" rx="16" fill="#FFFFFF" stroke="#1F1F1F" stroke-opacity="0.08" filter="url(#cardShadow)"/>
    <text x="22" y="38" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#8A8880">02 · AGENT HOST</text>
    <text x="22" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1F1F1F">Harness</text>
    <line x1="22" y1="88" x2="258" y2="88" stroke="#1F1F1F" stroke-opacity="0.08"/>

    <text x="22" y="116" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#33302A">Claude Code · Cursor</text>
    <text x="22" y="138" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#33302A">Codex · Zed · Cline · …</text>

    <rect x="20" y="158" width="240" height="74" rx="10" fill="#F7F5EC" stroke="#1F1F1F" stroke-opacity="0.07"/>
    <text x="34" y="182" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#8A8880">HOOKS — CLAUDE CODE ONLY</text>
    <text x="34" y="202" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#33302A">PreToolUse guard</text>
    <text x="34" y="220" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#33302A">prompt redactor</text>
  </g>

  <!-- ================= BROKER card ================= -->
  <g transform="translate(864,96)">
    <rect x="0" y="0" width="280" height="300" rx="16" fill="#FFFFFF" stroke="#1F1F1F" stroke-opacity="0.08" filter="url(#cardShadow)"/>
    <text x="22" y="38" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="#D97757" font-weight="600">03 · TRUSTED</text>
    <text x="22" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1F1F1F">Broker</text>
    <line x1="22" y1="88" x2="258" y2="88" stroke="#1F1F1F" stroke-opacity="0.08"/>

    <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#33302A">
      <circle cx="27" cy="106" r="2" fill="#1F1F1F" fill-opacity="0.35"/><text x="36" y="110">manifest engine</text>
      <circle cx="27" cy="126" r="2" fill="#1F1F1F" fill-opacity="0.35"/><text x="36" y="130">ticket store</text>
      <circle cx="27" cy="146" r="2" fill="#1F1F1F" fill-opacity="0.35"/><text x="36" y="150">prompter registry</text>
      <circle cx="27" cy="166" r="2" fill="#1F1F1F" fill-opacity="0.35"/><text x="36" y="170">validator + probes</text>
      <circle cx="27" cy="186" r="2" fill="#1F1F1F" fill-opacity="0.35"/><text x="36" y="190">redactor (egress)</text>
    </g>

    <rect x="20" y="206" width="258" height="58" rx="10" fill="#F7F5EC" stroke="#1F1F1F" stroke-opacity="0.07"/>
    <text x="34" y="226" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#8A8880">SINK REGISTRY</text>
    <text x="34" y="244" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="13" fill="#33302A">.env · keychain · vault · sops …</text>
    <text x="34" y="259" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.2" fill="#D97757">SECRETS INJECTED LOCALLY</text>
  </g>

  <!-- ============ protocol arrows (no values) ============ -->
  <line x1="336" y1="246" x2="452" y2="246" stroke="#1F1F1F" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <rect x="342" y="235" width="112" height="22" rx="11" fill="#FFFFFF" stroke="#1F1F1F" stroke-opacity="0.12"/>
  <text x="398" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1" fill="#33302A">MCP · JSON-RPC</text>
  <text x="398" y="274" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A8880">never carries</text>
  <text x="398" y="288" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A8880">secret values</text>

  <line x1="740" y1="246" x2="856" y2="246" stroke="#1F1F1F" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrowInk)"/>
  <rect x="750" y="235" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#1F1F1F" stroke-opacity="0.12"/>
  <text x="802" y="250" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="1" fill="#33302A">SPAWN · STDIO</text>
  <text x="802" y="274" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8A8880">local process only</text>

  <!-- ============ value path (the one accent line) ============ -->
  <rect x="76" y="444" width="84" height="36" rx="18" fill="#FFFFFF" stroke="#D97757" stroke-width="1.25"/>
  <text x="118" y="466" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="2" fill="#D97757">USER</text>

  <path d="M160,462 H992 Q1004,462 1004,450 V399" fill="none" stroke="#D97757" stroke-width="1.75" marker-end="url(#arrowAccent)"/>

  <text x="580" y="450" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2" fill="#D97757">THE ONLY PATH A VALUE TRAVELS</text>
  <text x="580" y="480" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#8A8880">typed once by you · stored to .env or your keychain · injected locally — never sent to the model</text>
</svg>
